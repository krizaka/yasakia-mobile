name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The standard checks of the Krizaka Expo apps: the org's reusable expo-ci (krizaka/.github#148) - lint, types, unit tests and the
# iOS + Android bundle export, side by side.
jobs:
  ci:
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/expo-ci.yml@d95527618e5b070cff81d248964290b732e31886 # v1.4.0
    with:
      extra-scripts: |
        export

  # The required check keeps its name; it reads the gate's verdict. Goes when protection requires « ci / CI gate ».
  check:
    name: Lint, types, tests, iOS and Android bundles
    needs: ci
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    env:
      RESULT: ${{ needs.ci.outputs.result }}
    steps:
      - run: test "$RESULT" = success
